name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.13"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: make install
      - name: Check style and behavior
        run: make check
      - name: Build distributions
        run: make build
      - name: Check distribution metadata
        run: uvx twine check dist/*
