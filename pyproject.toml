[project]
name = "primitive-db"
version = "0.1.0"
description = "A procedural console database for Python homework 2"
readme = "README.md"
authors = [
    { name = "Fyodor Simonov", email = "fsimonov@dantebet.tech" }
]
requires-python = ">=3.12"
dependencies = [
    "prompt>=0.4.1",
]

[project.scripts]
project = "primitive_db.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "**pycache**"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
